[project]
name = "datia-backbone"
version = "0.1.0"
description = "Per-client data pipeline, Claude agents and Power BI automation for Dominican SMEs"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "msal>=1.28",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "pyjwt[crypto]>=2.8",
  "uvicorn>=0.29",
  "pypdf>=4.0",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.8", "pyodbc>=5.0"]
dev = ["pytest>=8", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backbone*", "portal*", "infra*"]

[tool.setuptools.package-data]
portal = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
